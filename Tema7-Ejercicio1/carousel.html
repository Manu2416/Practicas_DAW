<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corousel</title>
    <link rel="stylesheet" href="./styles/corusel.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <!-- Slider main container -->

        <div class="swiper">
         
        
             <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <div class="row box-slide">
                            <div class="col-8  ">
                                <div class="box-left">
                                    <button class="left-btn rounded-pill">CASO DE ÉXITO </button>
                                    <h2 class="left-title">Towerbank</h2>
                                    <p class="left-text">El viaje de Towerbank hacia la modernidad</p>
                                    <a href="" title="sigue leyendo" class="left-link"> SIGUE LEYENDO -></a>
                                </div>
                            </div>
                            <div class="col-4 right right--tecno">
                                    <div class="right-box">
                                        <div class="right-box-text rounded-pill"> Towerbank</div>
                                        <div class="right-box-text rounded-pill"> Banca y Mercado de Capitales</div>
                                        <div class="right-box-text rounded-pill"> APPIAN</div>
                                    </div>
                            </div>
                        </div>
                    </div>
                    

                    <div class="swiper-slide">
                        <div class="row box-slide">
                            <div class="col-8  ">
                                <div class="box-left">
                                    <button class="left-btn rounded-pill">CASO DE ÉXITO </button>
                                    <h2 class="left-title">Telefónica</h2>
                                    <p class="left-text">Innovacion digital pionera</p>
                                    <a href="" title="sigue leyendo" class="left-link"> SIGUE LEYENDO -></a>
                                </div>
                            </div>
                            <div class="col-4 right right--tele">
                                    <div class="right-box">
                                        <div class="right-box-text rounded-pill"> Telefononica</div>
                                        <div class="right-box-text rounded-pill"> Telecomunicaciones & Medios de Comunicacion</div>
                                        <div>
                                            <div class="right-box-text rounded-pill"> Experiencia de usuario</div>
                                            <div class="right-box-text rounded-pill"> SAP</div>
                                        </div>
                                    </div>
                            </div>
                        </div>
                    </div>
                    <div class="swiper-slide">
                    </div>
                    <div class="swiper-slide">
                    </div>
                    <div class="swiper-slide">
                    </div>
                    <div class="swiper-slide">
                    </div>
                    <div class="swiper-slide">
                    </div>
                    <div class="swiper-slide">
                    </div>
             </div>
           
         
          <div class="controls">
                 <div class="swiper-button-prev"></div>
                 <div class="swiper-button-next"></div>
                <div class="swiper-pagination"></div>
              
          </div>
        </div>

      
        
   

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./scripts/swips.js"></script>
</body>
</html>
