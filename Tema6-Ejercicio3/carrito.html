<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/carrito.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <section class="container mt-5">

            <table class="table ">
                <thead class="table__head">
                  <tr>
                    <th colspan="2" class="table__title">Product</th>
                    <th colspan="1" class="table__title">Price</th>
                    <th colspan="1" class="table__title">SIZE</th>
                    <th colspan="1" class="table__title">QUANTITY</th>
                    <th colspan="1" class="table__title">TOTAL</th>
                  </tr>
                </thead>
                <tbody id="carrito-body" class="carrito-body">
              
                </tbody>
              </table>
              <div class="botton d-flex justify-content-between align-items-center mt-3 ">
               
                <div class="botton-btn">
                    <button class="btn btn-checkout">Checkout</button>
                    <button class="btn btn-return">Return to Shop</button>   
                </div>

                <h4 class="botton-value">
                    <span class="table__title">Total Value:</span> 
                    <span id="total-carrito" class="botton-value-total">0</span>
                </h4>
            
                </div>
      
    </section>
    <script src="./scripts/carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
